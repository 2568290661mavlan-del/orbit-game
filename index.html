<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回旋 ORBIT</title>
<style>
:root{--ui-scale:1}
html,body{margin:0;height:100%;background:#05060a;color:#e8ecf5;overflow:hidden;
  font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
  font-size:calc(16px * var(--ui-scale))}
.panel{overflow-y:auto}
.panel.settings{justify-content:flex-start}
#game{display:block;width:100%;height:100%;background:#0b0f1a}
.hud{position:absolute;left:1em;top:.9em;right:1em;display:flex;justify-content:space-between;
  align-items:center;pointer-events:none;font:600 .95em/1.2 system-ui,sans-serif;text-shadow:0 1px 3px #000}
.hside{display:flex;gap:.5em;align-items:center}
.chip{background:rgba(10,16,30,.55);border:1px solid rgba(120,160,220,.25);border-radius:.45em;
  padding:.3em .6em;color:#dce8ff;white-space:nowrap}
.chip.chain{color:#ffd76a;opacity:.35}
.chip.chain.on{opacity:1;border-color:#ffd76a}
.chip.stance{color:#c9a7ff;border-color:#c9a7ff}
.chip.stance.break{color:#ffb347;border-color:#ffb347}
.hull{display:flex;gap:3px}
.pip{width:11px;height:16px;border-radius:2px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18)}
.pip.on{background:#7ef9c6;border-color:#7ef9c6}
.pip.on.low{background:#ff6b8a;border-color:#ff6b8a}
.gauge{width:5.5em;height:.6em;background:rgba(255,255,255,.10);border-radius:1em;overflow:hidden;
  border:1px solid rgba(120,160,220,.25)}
.gauge i{display:block;height:100%;width:0;background:#4fd6ff}
.gauge.full i{background:#ffe14d}
.perf{position:absolute;right:1em;bottom:.7em;color:#7ef9c6;pointer-events:none;
  font:600 .8em ui-monospace,Consolas,monospace;text-shadow:0 1px 3px #000}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.45em;background:rgba(4,6,12,.84);text-align:center;padding:1.5em}
.panel.hidden{display:none}
.tutbar{position:absolute;left:50%;top:3.2em;transform:translateX(-50%);max-width:92%;
  background:rgba(10,16,30,.82);border:1px solid #4fd6ff;border-radius:.5em;
  padding:.5em 1em;font:600 1em/1.5 system-ui,sans-serif;color:#dff0ff;text-align:center;
  pointer-events:none;text-shadow:0 1px 3px #000}
.tutbar.hidden{display:none}
.title{font-size:2.3em;margin:0;letter-spacing:.06em}
.title.win{color:#7ef9c6}
.title.lose{color:#ff6b6b}
.tag{color:#9fb0cc;margin:.2em;font-size:1em}
.hint{color:#8fa0bb;font-size:.9em;margin:.2em}
.cta{margin-top:.9em;color:#ffd166;font-weight:700}
.choices{display:flex;gap:.9em;flex-wrap:wrap;justify-content:center;margin-top:.9em}
.choice{display:flex;gap:.7em;align-items:center;background:#121a2b;border:2px solid #2a3a55;
  color:#e8ecf5;padding:.75em 1em;border-radius:.5em;cursor:pointer;font-size:1em;
  min-width:12em;text-align:left;font-family:inherit}
.choice:hover,.choice:focus{border-color:#4fd6ff;background:#17233a;outline:none}
.num{display:flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;
  border-radius:.3em;background:#2a3a55;font-weight:700;flex:none}
.box{display:flex;flex-direction:column}
.name{font-weight:700}
.desc{font-size:.85em;color:#9fb0cc}
.icon{font-size:1.5em;line-height:1;color:#7ef9c6}
.delta{font-size:.8em;color:#7ef9c6;font-variant-numeric:tabular-nums;margin-top:.15em}
.combo{font-size:.8em;color:#ffe14d;font-weight:700;margin-top:.15em}
.row{display:flex;gap:1em;justify-content:space-between;width:min(26em,100%);font-size:.95em}
.k{color:#8fa0bb;flex:none}
.v{font-weight:700;text-align:right;max-width:62%;overflow-wrap:anywhere}
.srow{display:flex;gap:1em;align-items:center;justify-content:space-between;width:min(30em,100%);font-size:.9em}
.opts{display:flex;gap:.4em;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.opt{background:#121a2b;border:2px solid #2a3a55;color:#c8d4e8;padding:.3em .7em;border-radius:.35em;
  cursor:pointer;font-size:.9em;font-family:inherit}
.opt:hover,.opt:focus{border-color:#4fd6ff;outline:none}
.opt.on{background:#1d3550;border-color:#4fd6ff;color:#fff;font-weight:700}
.range{width:9em;accent-color:#4fd6ff}
.val{min-width:2.6em;text-align:right;font:600 .9em ui-monospace,Consolas,monospace;color:#7ef9c6}
.back{margin-top:.8em;justify-content:center;min-width:10em}
</style>
</head>
